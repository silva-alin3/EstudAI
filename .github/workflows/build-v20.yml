name: Build EstudAI v2.0 APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and patch v2.0 sources
        run: |
          cat v19/app.00.js v19/app.01.js v19/app.02.js v19/app.03.js > app.js
          cat v19/css.00.css v19/css.01.css v19/css.02.css > styles.css
          python3 - <<'PY'
          import base64,re,pathlib
          # avatars
          raw=''.join(pathlib.Path(f'avatar-parts/{i:02d}.b64').read_text() for i in range(8))
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw)); clean += '='*((4-len(clean)%4)%4)
          pathlib.Path('avatars_hd.jpg').write_bytes(base64.b64decode(clean,validate=False))
          # HQ icon source
          raw=pathlib.Path('v20/icon.b64').read_text(); clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw)); clean += '='*((4-len(clean)%4)%4)
          pathlib.Path('icon-source.webp').write_bytes(base64.b64decode(clean,validate=False))

          p=pathlib.Path('app.js'); s=p.read_text()
          s=s.replace("import iconUrl from './icon.jpg';","import iconUrl from './icon.png';")

          # Home: user's declared weak area always stays first priority.
          home=r'''function home(){const sorted=AREAS.slice().sort((a,b)=>state.difficultyScores[a]-state.difficultyScores[b]);const weak=state.selfReportedWeak;const ranked=weak?[weak,...sorted.filter(a=>a!==weak)]:sorted;const daily=Math.min(100,pct(state.dailyXp,60));return `<section class="hero"><span class="eyebrow">${esc(state.goal)}</span><h1>Seu estudo, do seu jeito.</h1><p>O EstudAI dá mais atenção ao que você precisa melhorar sem abandonar as outras áreas.</p><div class="hero-actions"><button class="primary" data-action="personal-study">▶ Estudo personalizado</button><button class="secondary" data-tab="redacao">✍ Treinar redação</button></div><div class="goal"><div><b>Meta de hoje</b><strong>${daily}%</strong></div><div class="progress"><i style="width:${daily}%"></i></div><small>${state.dailyXp}/60 XP hoje</small></div></section><section><div class="title-row focus-title"><h2>Foco recomendado</h2><span>baseado no seu desempenho</span></div><div class="focus-grid">${ranked.map((a,i)=>`<article class="focus-card tone-${i}"><div class="focus-icon">${['📖','🌎','🧪','📐'][AREAS.indexOf(a)]}</div><div><small>${i===0?'PRIORIDADE':'REVISÃO'}</small><h3>${a}</h3><p>${state.difficultyScores[a]}% de domínio estimado</p></div><button data-action="area-study" data-area="${a}">Praticar →</button></article>`).join('')}</div></section>`}'''
          s=re.sub(r'function home\(\)\{.*?\}\n\nfunction desempenho',home+'\n\nfunction desempenho',s,flags=re.S)

          # Questions: cleaner source, no duplicated ENEM tag, markdown symbols cleaned, real images rendered.
          helper=r'''
function questionText(raw){let x=esc(String(raw||''));x=x.replace(/!\[[^\]]*\]\([^)]*\)/g,'');x=x.replace(/https?:\/\/\S+\.(?:png|jpe?g|webp)(?:\?\S*)?/gi,'');x=x.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');x=x.replace(/__(.*?)__/g,'<strong>$1</strong>');x=x.replace(/_([^_\n]{1,120})_/g,'<em>$1</em>');x=x.replace(/\|\|/g,'');x=x.replace(/\n{3,}/g,'\n\n');return x}
function questionMedia(q){const out=[];const add=u=>{u=String(u||'').trim();if(/^https?:\/\//.test(u)&&!out.includes(u))out.push(u)};(q.files||[]).forEach(f=>add(typeof f==='string'?f:(f.url||f.href||'')));const txt=[q.context,q.q].join(' ');for(const m of txt.matchAll(/https?:\/\/[^\s)]+\.(?:png|jpe?g|webp)(?:\?[^\s)]*)?/gi))add(m[0]);return out}
function questionMediaHtml(q){return questionMedia(q).map(u=>`<figure class="question-media"><img src="${u}" alt="Imagem da questão" loading="lazy"><figcaption><a href="${u}" target="_blank" rel="noopener">Fonte da imagem</a></figcaption></figure>`).join('')}
'''
          s=s.replace('function quizView(){',helper+'\nfunction quizView(){',1)
          quiz=r'''function quizView(){const q=quiz.items[quiz.i],ans=quiz.answers[quiz.i],checked=quiz.checked[quiz.i];const tag=q.year?`ENEM ${q.year}`:(q.topic||q.area);return `<div class="quiz-top"><button class="close" data-action="exit-quiz">✕</button><div><span>${quiz.title}</span><b>Questão ${quiz.i+1} de ${quiz.items.length}</b></div><div class="qprogress"><i style="width:${(quiz.i+1)/quiz.items.length*100}%"></i></div></div><article class="question-card"><span class="eyebrow">${tag}</span>${q.context?`<div class="context qtext">${questionText(q.context)}</div>`:''}${questionMediaHtml(q)}<div class="question-command qtext">${questionText(q.q)}</div><div class="answers">${q.a.map((x,i)=>`<button data-answer="${i}" class="${ans===i?'selected':''} ${checked&&i===q.c?'correct':''} ${checked&&ans===i&&i!==q.c?'wrong':''}" ${checked?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${questionText(x)}</span></button>`).join('')}</div>${checked?`<div class="feedback ${ans===q.c?'good':'bad'}"><h3>${ans===q.c?'✅ Resposta correta!':'❌ Resposta incorreta'}</h3>${ans!==q.c?`<p><b>Resposta correta:</b> ${String.fromCharCode(65+q.c)} — ${questionText(q.a[q.c])}</p>`:''}${q.e&&!/Questão oficial anterior/i.test(q.e)?`<p>${questionText(q.e)}</p>`:''}</div>`:''}</article><div class="quiz-bar">${!checked?`<button class="primary" data-action="confirm-answer" ${ans==null?'disabled':''}>Confirmar resposta</button>`:`<button class="primary" data-action="next-question">${quiz.i===quiz.items.length-1?'Ver resultado':'Próxima questão →'}</button>`}</div>`}'''
          s=re.sub(r'function quizView\(\)\{.*?\}\nfunction finishQuiz',quiz+'\nfunction finishQuiz',s,flags=re.S)
          s=s.replace("e:'Questão oficial anterior do ENEM. Releia o comando, elimine distratores e identifique a habilidade cobrada.'","e:''")

          # Essay: actual theme adherence + strengths + mistakes + actionable tips.
          essay=r'''function normWords(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9à-ÿ\s]/g,' ').split(/\s+/).filter(Boolean)}
function themeMatch(text,theme){const stop=new Set(['desafios','caminhos','para','sobre','acerca','brasil','brasileira','brasileiro','sociedade','medidas','papel','impactos','garantir','enfrentamento','valorizacao','perspectivas']);const tt=[...new Set(normWords(theme).filter(w=>w.length>=5&&!stop.has(w)))];const words=new Set(normWords(text));const matched=tt.filter(t=>[...words].some(w=>w===t||w.startsWith(t.slice(0,6))||t.startsWith(w.slice(0,6))));return{terms:tt,matched,ratio:tt.length?matched.length/tt.length:0}}
function scoreEssay(text){const wc=countWords(text),pars=text.split(/\n+/).filter(x=>x.trim()).length,low=text.toLowerCase(),connect=['além disso','portanto','entretanto','contudo','assim','dessa forma','nesse sentido','por conseguinte','todavia'].filter(x=>low.includes(x)).length,agents=['governo','estado','escola','sociedade','ministério','prefeitura','mídia','família'].filter(x=>low.includes(x)).length,actions=['deve','promover','criar','implementar','ampliar','garantir','investir','fiscalizar','desenvolver'].filter(x=>low.includes(x)).length,rel=themeMatch(text,state.theme);if(wc<40)return{total:0,comp:[0,0,0,0,0],tips:['Desenvolva uma redação completa antes de solicitar a correção.'],strengths:[],issues:['Texto curto demais para uma avaliação confiável.'],relevance:rel};const offTopic=rel.matched.length===0;let c1=wc>=280?200:wc>=220?160:120;let c2=offTopic?0:rel.matched.length>=4?200:rel.matched.length>=3?160:rel.matched.length>=2?120:80;let c3=pars>=4?200:pars>=3?160:120;let c4=connect>=5?200:connect>=3?160:connect>=1?120:80;let interv=agents.length&&actions.length;c5=interv?(agents.length>=2&&actions.length>=2?200:160):80;const strengths=[],issues=[],tips=[];if(wc>=220)strengths.push('Boa extensão para desenvolver uma argumentação completa.');if(pars>=4)strengths.push('Estrutura em parágrafos bem definida.');if(connect>=3)strengths.push('Você utilizou conectivos para organizar a progressão das ideias.');if(interv)strengths.push('Há uma proposta de intervenção identificável.');if(!offTopic&&rel.matched.length>=2)strengths.push(`O texto dialoga com o tema por meio de: ${rel.matched.slice(0,4).join(', ')}.`);if(offTopic){issues.push('Fuga ao tema: não encontrei relação suficiente entre o texto e o tema selecionado.');tips.push(`Reescreva a tese e os argumentos tratando diretamente de “${state.theme}”.`)}else if(rel.matched.length<2){issues.push('A abordagem do tema ainda está muito indireta.');tips.push('Retome palavras-chave e ideias centrais do tema ao longo da tese e dos desenvolvimentos.')}if(wc<220){issues.push('O desenvolvimento ficou curto.');tips.push('Amplie os argumentos com causa, consequência, exemplo e repertório pertinente.')}if(pars<4){issues.push('A organização dos parágrafos pode melhorar.');tips.push('Use introdução, dois desenvolvimentos e conclusão.')}if(connect<3){issues.push('Pouca variedade de conectivos.');tips.push('Use conectivos diferentes para relacionar causa, contraste, consequência e conclusão.')}if(!interv){issues.push('Proposta de intervenção incompleta.');tips.push('Inclua agente, ação, meio de execução, finalidade e detalhamento.')}const comp=[c1,c2,c3,c4,c5];const total=offTopic?0:comp.reduce((a,b)=>a+b,0);return{total,comp,tips,strengths,issues,relevance:rel,offTopic}}
function essayResult(r){const names=['Norma-padrão','Tema e repertório','Argumentação','Coesão','Intervenção'];return `<div class="essay-result"><div class="essay-score ${r.offTopic?'off-topic':''}"><span>Nota estimada</span><strong>${r.total}</strong><small>/1000</small></div>${r.offTopic?`<div class="theme-alert"><h3>⚠️ Fuga ao tema detectada</h3><p>O texto não apresentou relação suficiente com <b>${esc(state.theme)}</b>. Em uma redação do ENEM, fugir ao tema pode zerar a prova.</p></div>`:''}${names.map((n,i)=>`<div class="competence"><div><span>${n}</span><b>${r.comp[i]}/200</b></div><div class="progress"><i style="width:${r.comp[i]/2}%"></i></div></div>`).join('')}<div class="essay-feedback-grid"><section class="strength-box"><h3>✅ O que você fez bem</h3>${r.strengths.length?r.strengths.map(t=>`<p>• ${t}</p>`).join(''):'<p>Continue praticando para consolidar seus pontos fortes.</p>'}</section><section class="issue-box"><h3>🔎 O que precisa melhorar</h3>${r.issues.length?r.issues.map(t=>`<p>• ${t}</p>`).join(''):'<p>Nenhum problema crítico identificado nesta análise.</p>'}</section></div><div class="improve"><h3>🎯 Próximos passos</h3>${r.tips.map(t=>`<p>• ${t}</p>`).join('')}<button class="caramelo-ask" data-action="ask-caramelo-essay">Pedir uma análise ao Prof. Caramelo 🐶 →</button></div></div>`}'''
          s=re.sub(r'function scoreEssay\(text\)\{.*?\}\nfunction essayResult\(r\)\{.*?\}\nfunction themePanel',essay+'\nfunction themePanel',s,flags=re.S)

          # Prof. Caramelo: reliable, immediate contextual tutor even if server is unavailable.
          prof=r'''function localProfAnswer(text){const low=text.toLowerCase(),weak=state.selfReportedWeak||AREAS.slice().sort((a,b)=>state.difficultyScores[a]-state.difficultyScores[b])[0];if(/^\s*(oi|ol[aá]|hey|bom dia|boa tarde|boa noite)/i.test(text))return `Oi! 🐶📚 Eu sou o Prof. Caramelo. Posso explicar uma questão, ajudar com redação, mostrar como usar o EstudAI ou montar um plano para seu foco em ${weak}. ✨`;if(/como (usar|funciona)|usar o app|usar o estudai|aplicativo/.test(low))return 'Use **Início** para ver seu foco recomendado, **Simulados** para treinar questões oficiais, **Desempenho** para acompanhar suas métricas, **Redação** para escrever e receber análise e **Perfil** para personalizar sua experiência. Eu fico no botão do cachorrinho para ajudar quando precisar. 🐶📱✨';if(/matem/.test(low))return `Para melhorar em Matemática, faça blocos curtos, classifique cada erro por assunto e refaça as questões erradas depois. Como seu foco declarado é ${state.selfReportedWeak||'o diagnóstico atual'}, vou ajustar a prioridade sem abandonar as outras áreas. 📐🐾`;if(/redação|redacao|tema/.test(low))return `Na redação sobre “${state.theme}”, confirme primeiro se sua tese responde diretamente ao tema. Depois use dois argumentos relacionados, repertório pertinente e uma intervenção com agente, ação, meio, finalidade e detalhamento. ✍️🎯`;if(/desempenho|melhorar|dificuldade|ponto fraco/.test(low))return `Seu foco principal informado é ${state.selfReportedWeak||weak}. Vou respeitar essa escolha e usar seus resultados apenas para ajustar o reforço dentro das outras matérias. 📊🐶`;if(/hist[oó]ria|humanas/.test(low))return 'Em Humanas, conecte contexto, causa, consequência e leitura crítica das fontes. Leia o comando antes de voltar ao texto-base. 🌎📚';if(/natureza|biologia|qu[ií]mica|f[ií]sica/.test(low))return 'Em Natureza, identifique primeiro o fenômeno e as grandezas envolvidas; depois escolha o conceito ou fórmula. 🧪🔬';if(/linguagem|portugu|interpreta/.test(low))return 'Em Linguagens, leia o comando primeiro e procure no texto a evidência que sustenta a alternativa. Evite responder só pelo assunto geral. 📖✨';return `Posso te ajudar com essa dúvida de estudo. Seu foco principal está em ${state.selfReportedWeak||weak}, e eu continuo equilibrando as demais áreas. 🐶📚✨`}
async function sendProf(){const input=document.querySelector('#profInput'),text=input.value.trim();if(!text)return;state.chat.push({role:'user',text});save();renderProfPanel();const typing=document.querySelector('#profTyping');if(typing)typing.innerHTML='<div class="msg assistant typing">Pensando na melhor forma de te explicar… 🐶💭✨</div>';await new Promise(r=>setTimeout(r,420));state.chat.push({role:'assistant',text:localProfAnswer(text)});save();renderProfPanel()}
function renderProfPanel(prefill='',auto=false){document.querySelector('#profPanel').innerHTML=profPanel(prefill);bindProf();setTimeout(()=>{const c=document.querySelector('#chat');if(c)c.scrollTop=c.scrollHeight;if(auto){const i=document.querySelector('#profInput');if(i&&i.value.trim())sendProf()}},50)}'''
          s=re.sub(r'function localProfAnswer\(text\)\{.*?\}\nfunction friendlyAnswer.*?\nasync function sendProf\(\)\{.*?\}\nfunction renderProfPanel\(prefill=.*?\}\n',prof+'\n',s,flags=re.S)
          s=s.replace("else if(a==='ask-caramelo-essay')renderProfPanel(`Analise como eu posso melhorar minha redação sobre: ${state.theme}`)","else if(a==='ask-caramelo-essay')renderProfPanel(`Analise como eu posso melhorar minha redação sobre: ${state.theme}`,true)")

          # Splash -> onboarding/home transitions.
          s=s.replace("app.innerHTML=splash();initStatusBar();setTimeout(render,900);","app.innerHTML=splash();initStatusBar();setTimeout(()=>{const sp=document.querySelector('.splash');if(sp)sp.classList.add('exit');setTimeout(render,420)},1150);")
          p.write_text(s)

          # CSS v2 overrides
          css=pathlib.Path('styles.css').read_text()+r'''
/* v2.0 visual polish */
.brand img,.splash img{background:transparent;border:0;object-fit:cover}.brand img{box-shadow:none}.splash{transition:opacity .38s ease,transform .38s ease}.splash.exit{opacity:0;transform:scale(1.035);pointer-events:none}.onboarding{animation:onboardIn .48s ease both}@keyframes onboardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.focus-title{align-items:center;flex-wrap:nowrap}.focus-title h2{white-space:nowrap}.focus-title span{white-space:nowrap;font-size:13px}
.metrics-hero{background:linear-gradient(135deg,#0b67b2 0%,#1197c4 34%,#07854a 70%,#e5c22f 120%)}.metrics-hero .eyebrow{background:rgba(255,255,255,.18)}.streak-banner{background:rgba(255,255,255,.88);color:#075e8e}.purple-card{background:#e8f7ef;color:#07854a}.pink{background:#eaf5ff;color:#0b67b2}.yellow-card{background:#fff4c7;color:#7b5b00}.blue-card{background:#e3f6fb;color:#087b9c}.evo-col i{background:linear-gradient(180deg,#0b67b2,#07854a,#ffd132)}
.qtext{font-size:18px!important;line-height:1.55!important;font-weight:400!important;color:#2f3c50;white-space:pre-line;overflow-wrap:anywhere}.question-command{font-size:19px!important;font-weight:700!important;color:var(--ink);margin:18px 0 8px}.question-card h2{font-size:19px!important;line-height:1.55!important}.question-media{margin:16px 0}.question-media img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:16px;background:#f6f8fa}.question-media figcaption{font-size:10px;text-align:right;margin-top:4px}.question-media a{color:#8b95a3;text-decoration:none;max-width:100%;overflow-wrap:anywhere}.answers span{font-size:16px;line-height:1.45}.feedback p{font-size:16px;line-height:1.45}
.essay-feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.strength-box,.issue-box,.theme-alert{border-radius:18px;padding:15px}.strength-box{background:#eaf8ef;border:1px solid #bfe4ce}.issue-box{background:#fff2ed;border:1px solid #f1c4b7}.theme-alert{background:#fff0ee;border:1px solid #f0b8b1;margin:14px 0;color:#8f251e}.essay-score.off-topic strong{background:none;color:#c62e24;-webkit-text-fill-color:#c62e24}
.prof-head img,.prof-fab img{object-position:center 38%}.prof-head img{width:62px;height:62px}.msg.assistant strong{color:#0878a8}
@media(max-width:650px){.focus-title{display:flex;gap:8px}.focus-title h2{font-size:28px}.focus-title span{font-size:11px}.essay-feedback-grid{grid-template-columns:1fr}.qtext{font-size:16px!important}.question-command{font-size:17px!important}.answers span{font-size:15px}}
'''
          pathlib.Path('styles.css').write_text(css)
          PY
          node --check app.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare HQ icon and Prof. Caramelo
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import numpy as np
          src=Image.open('icon-source.webp').convert('RGBA').resize((1024,1024),Image.Resampling.LANCZOS)
          a=np.array(src)
          h,w=a.shape[:2]
          yy,xx=np.ogrid[:h,:w]
          corner=((xx<150)&(yy<150))|((xx>w-150)&(yy<150))|((xx<150)&(yy>h-150))|((xx>w-150)&(yy>h-150))
          dark=a[:,:,:3].max(axis=2)<28
          a[corner&dark,3]=0
          icon=Image.fromarray(a)
          icon.save('icon.png',optimize=True)
          # dog-only tutor portrait (no EstudAI wordmark)
          rgb=src.convert('RGB')
          prof=rgb.crop((100,20,924,844)).resize((768,768),Image.Resampling.LANCZOS)
          prof.save('prof-caramelo.jpg',quality=96,optimize=True)
          PY
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os,shutil
          img=Image.open('icon.png').convert('RGBA')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}';os.makedirs(path,exist_ok=True)
              art=img.resize((size,size),Image.Resampling.LANCZOS)
              art.save(f'{path}/ic_launcher.png');art.save(f'{path}/ic_launcher_round.png')
          p='android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.isdir(p):shutil.rmtree(p)
          PY
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI-v2.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-v2.0-APK
          path: EstudAI-v2.0.apk
          if-no-files-found: error
          retention-days: 30
