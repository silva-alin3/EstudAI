name: Trigger EstudAI v2.0 Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v20.yml'
      - 'v20/manual-trigger.txt'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v2.0 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-v20.yml/dispatches \
            -d '{"ref":"main"}'
