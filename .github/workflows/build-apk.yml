name: Build EstudAI APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: estudai-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild EstudAI v1.7 sources and assets
        run: |
          cat build-src/app.00.js build-src/app.01.js build-src/app.02.js build-src/app.03.js > app.js
          cat build-src/styles.00.css build-src/styles.01.css build-src/styles.02.css > styles.css
          python3 - <<'PY'
          import base64,re,pathlib
          def rebuild(parts,out):
              raw=''.join(pathlib.Path(p).read_text(encoding='utf-8') for p in parts)
              clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw))
              clean += '='*((4-len(clean)%4)%4)
              pathlib.Path(out).write_bytes(base64.b64decode(clean,validate=False))
          rebuild([f'avatar-parts/{i:02d}.b64' for i in range(8)],'avatars.jpg')
          rebuild([f'icon-parts/{i:02d}.b64' for i in range(3)],'icon.jpg')
          PY
          file icon.jpg avatars.jpg
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android status bar and launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageFile
          import os,shutil
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          img=Image.open('icon.jpg').convert('RGB')
          side=max(img.size)
          sq=Image.new('RGB',(side,side),'#0B67B2')
          sq.paste(img,((side-img.width)//2,(side-img.height)//2))
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}'
              os.makedirs(path,exist_ok=True)
              art=sq.resize((size,size),Image.Resampling.LANCZOS)
              art.save(f'{path}/ic_launcher.png')
              art.save(f'{path}/ic_launcher_round.png')
          if os.path.isdir('android/app/src/main/res/mipmap-anydpi-v26'):
              shutil.rmtree('android/app/src/main/res/mipmap-anydpi-v26')
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI-v1.7.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-v1.7-APK
          path: EstudAI-v1.7.apk
          if-no-files-found: error
          retention-days: 30
