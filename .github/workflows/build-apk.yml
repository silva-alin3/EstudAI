name: Build EstudAI APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: estudai-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild EstudAI v1.7 sources and avatars
        run: |
          cat build-src/app.00.js build-src/app.01.js build-src/app.02.js build-src/app.03.js > app.js
          cat build-src/styles.00.css build-src/styles.01.css build-src/styles.02.css > styles.css
          python3 - <<'PY'
          import base64,re,pathlib
          raw=''.join(pathlib.Path(f'avatar-parts/{i:02d}.b64').read_text(encoding='utf-8') for i in range(8))
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw))
          clean += '='*((4-len(clean)%4)%4)
          pathlib.Path('avatars.jpg').write_bytes(base64.b64decode(clean,validate=False))

          p=pathlib.Path('app.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function fetchEnemQuestions')
          end=s.index('async function startQuiz',start)
          fixed=r'''async function fetchEnemQuestions(area,qty){
            const years=shuffle(Array.from({length:15},(_,i)=>2009+i));
            const desired=area==='Todas'?AREAS:[area];
            const result=[];
            outer: for(const year of years){
              for(const a of shuffle(desired)){
                if(result.length>=qty) break outer;
                try{
                  const res=await fetch(`https://api.enem.dev/v1/exams/${year}/questions?discipline=${areaMap[a]}&limit=200`);
                  if(!res.ok) continue;
                  const data=await res.json();
                  const raw=data.questions||data;
                  const mapped=(raw||[]).map(q=>{
                    const alts=q.alternatives||[];
                    const correctLetter=q.correctAlternative||q.correct_answer;
                    const c=Math.max(0,alts.findIndex(x=>(x.letter||'').toUpperCase()===String(correctLetter||'').toUpperCase()));
                    return {id:`enem-${year}-${a}-${q.index??q.id??q.title?.slice(0,20)}`,year,area:a,topic:`ENEM ${year}`,q:q.title||q.statement||q.question||'Questão do ENEM',context:q.context||'',files:q.files||[],a:alts.map(x=>x.text||x),c,e:'Consulte a alternativa correta e releia o enunciado, identificando a habilidade exigida nesta questão.'};
                  }).filter(q=>q.a.length>=4);
                  const unseen=mapped.filter(q=>!state.seenQuestionIds.includes(q.id));
                  result.push(...shuffle(unseen).slice(0,Math.max(0,qty-result.length)));
                }catch(e){}
              }
            }
            if(result.length<qty){
              const local=shuffle(fallbackQuestions.filter(q=>area==='Todas'||q.area===area))
                .filter(q=>!state.seenQuestionIds.includes(`local-${q.id}`))
                .map(q=>({...q,id:`local-${q.id}`,year:null}));
              result.push(...local.slice(0,qty-result.length));
            }
            return result.slice(0,qty);
          }
          '''
          p.write_text(s[:start]+fixed+s[end:],encoding='utf-8')
          PY
          node --check app.js
          file icon.jpg avatars.jpg
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageFile
          import os,shutil
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          img=Image.open('icon.jpg').convert('RGB')
          side=max(img.size)
          sq=Image.new('RGB',(side,side),'#0B67B2')
          sq.paste(img,((side-img.width)//2,(side-img.height)//2))
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}'
              os.makedirs(path,exist_ok=True)
              art=sq.resize((size,size),Image.Resampling.LANCZOS)
              art.save(f'{path}/ic_launcher.png')
              art.save(f'{path}/ic_launcher_round.png')
          if os.path.isdir('android/app/src/main/res/mipmap-anydpi-v26'):
              shutil.rmtree('android/app/src/main/res/mipmap-anydpi-v26')
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI-v1.7.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-v1.7-APK
          path: EstudAI-v1.7.apk
          if-no-files-found: error
          retention-days: 30
