name: Build EstudAI v1.9 APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble v1.9 web sources
        run: |
          cat v19/app.00.js v19/app.01.js v19/app.02.js v19/app.03.js > app.js
          cat v19/css.00.css v19/css.01.css v19/css.02.css > styles.css
          python3 - <<'PY'
          import base64,re,pathlib
          raw=''.join(pathlib.Path(f'avatar-parts/{i:02d}.b64').read_text(encoding='utf-8') for i in range(8))
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw)); clean += '='*((4-len(clean)%4)%4)
          pathlib.Path('avatars_hd.jpg').write_bytes(base64.b64decode(clean,validate=False))
          PY
          node --check app.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare image assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          img=Image.open('icon.jpg').convert('RGB')
          w,h=img.size
          # Prof. Caramelo: crop upper mascot area and remove app-name footer.
          crop=img.crop((0,0,w,int(h*0.76)))
          side=min(crop.size)
          left=(crop.width-side)//2; top=max(0,(crop.height-side)//2)
          crop=crop.crop((left,top,left+side,top+side)).resize((512,512),Image.Resampling.LANCZOS)
          crop.save('prof-caramelo.jpg',quality=95,optimize=True)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android status bar and launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageFile
          import os,shutil
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          img=Image.open('icon.jpg').convert('RGB')
          side=min(img.size)
          left=(img.width-side)//2; top=(img.height-side)//2
          sq=img.crop((left,top,left+side,top+side))
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}'; os.makedirs(path,exist_ok=True)
              art=sq.resize((size,size),Image.Resampling.LANCZOS)
              art.save(f'{path}/ic_launcher.png'); art.save(f'{path}/ic_launcher_round.png')
          p='android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.isdir(p): shutil.rmtree(p)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI-v1.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-v1.9-APK
          path: EstudAI-v1.9.apk
          if-no-files-found: error
          retention-days: 30
