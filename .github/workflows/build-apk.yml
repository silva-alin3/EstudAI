name: Build EstudAI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'icon.jpg'
      - 'manifest.json'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: estudai-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply EstudAI launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os, shutil
          img=Image.open('icon.jpg').convert('RGB')
          # Keep the complete artwork visible and avoid Android adaptive-icon zoom/crop.
          side=max(img.size)
          square=Image.new('RGB',(side,side),'#073b79')
          x=(side-img.width)//2; y=(side-img.height)//2
          square.paste(img,(x,y))
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}'
              os.makedirs(path,exist_ok=True)
              canvas=Image.new('RGB',(size,size),'#073b79')
              inner=max(1,int(size*.90))
              art=square.resize((inner,inner),Image.Resampling.LANCZOS)
              pad=(size-inner)//2
              canvas.paste(art,(pad,pad))
              canvas.save(f'{path}/ic_launcher.png',quality=95)
              canvas.save(f'{path}/ic_launcher_round.png',quality=95)
          # Force Android to use the raster icon instead of a foreground layer that crops the artwork.
          for folder in ['android/app/src/main/res/mipmap-anydpi-v26']:
              if os.path.isdir(folder): shutil.rmtree(folder)
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-APK
          path: EstudAI.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest EstudAI.apk --target "$GITHUB_SHA" --title "EstudAI Android" --notes "APK instalável do EstudAI para Android."