name: Build EstudAI v2.1 APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble source
        run: |
          cat v19/app.00.js v19/app.01.js v19/app.02.js v19/app.03.js > app.js
          cat v19/css.00.css v19/css.01.css v19/css.02.css > styles.css
          python3 v20/fix_regex.py
          python3 v20/patch.py
          python3 v20/video_fix.py
          node --check app.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare high-resolution EstudAI icon and Prof Caramelo
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageFilter
          src=Image.open('icon-source.webp').convert('RGB')
          src.load()
          w,h=src.size
          # Crop inside the rounded source artwork so the Android launcher mask receives a full-bleed image with no black corners.
          x1,y1=int(w*.08),int(h*.08)
          x2,y2=int(w*.92),int(h*.92)
          full=src.crop((x1,y1,x2,y2))
          icon=ImageOps.fit(full,(1024,1024),method=Image.Resampling.LANCZOS,centering=(.5,.5))
          icon=icon.filter(ImageFilter.UnsharpMask(radius=.8,percent=120,threshold=1))
          icon.save('icon.png',optimize=True)
          # Separate Prof. Caramelo portrait, without the EstudAI wordmark.
          prof=src.crop((int(w*.10),int(h*.01),int(w*.90),int(h*.69)))
          prof=ImageOps.fit(prof,(768,768),method=Image.Resampling.LANCZOS,centering=(.5,.42))
          prof=prof.filter(ImageFilter.UnsharpMask(radius=.7,percent=115,threshold=1))
          prof.save('prof-caramelo.jpg',quality=96,subsampling=0,optimize=True)
          print('HQ source',src.size,'launcher',icon.size,'prof',prof.size)
          PY
      - name: Set Android package id
        run: |
          python3 - <<'PY'
          import json
          p='capacitor.config.json'
          d=json.load(open(p))
          d['appId']='com.estudai.v21'
          d['appName']='EstudAI'
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          import os,shutil
          img=Image.open('icon.png').convert('RGBA')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}'
              os.makedirs(path,exist_ok=True)
              art=img.resize((size,size),Image.Resampling.LANCZOS)
              if size>=144: art=art.filter(ImageFilter.UnsharpMask(radius=.45,percent=85,threshold=1))
              art.save(f'{path}/ic_launcher.png',optimize=True)
              art.save(f'{path}/ic_launcher_round.png',optimize=True)
          p='android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.isdir(p): shutil.rmtree(p)
          PY
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI-v2.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-v2.1-APK
          path: EstudAI-v2.1.apk
          if-no-files-found: error
          retention-days: 30
