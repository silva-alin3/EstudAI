name: Build EstudAI v2.3 APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble source
        run: |
          cat v19/app.00.js v19/app.01.js v19/app.02.js v19/app.03.js > app.js
          cat v19/css.00.css v19/css.01.css v19/css.02.css > styles.css
          python3 v20/fix_regex.py
          python3 v20/patch.py
          python3 v20/video_fix.py
          python3 v20/tail_fix.py
          cat v22/runtime_overrides.js >> app.js
          cat v22/checklist.css >> styles.css
          cat v23/runtime_overrides.js >> app.js
          cat v23/video_fixes.css >> styles.css
          node --check app.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare app artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64,pathlib,re,shutil
          from PIL import Image, ImageOps, ImageEnhance, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          raw=pathlib.Path('icon-hq.b64').read_text(encoding='utf-8')
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw)); clean += '='*((4-len(clean)%4)%4)
          pathlib.Path('icon-source.jpg').write_bytes(base64.b64decode(clean,validate=False))
          src=Image.open('icon-source.jpg').convert('RGB')
          src=ImageEnhance.Sharpness(src).enhance(1.35)
          icon=ImageOps.fit(src,(1024,1024),method=Image.Resampling.LANCZOS)
          icon.save('icon.png',optimize=True)
          shutil.copyfile('v20/prof-caramelo-final.jpg','prof-caramelo.jpg')
          PY
      - name: Set Android package id
        run: |
          python3 - <<'PY'
          import json
          p='capacitor.config.json'
          d=json.load(open(p))
          d['appId']='com.estudai.v23'
          d['appName']='EstudAI'
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os,shutil
          img=Image.open('icon.png').convert('RGBA')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              path=f'android/app/src/main/res/{folder}'
              os.makedirs(path,exist_ok=True)
              art=img.resize((size,size),Image.Resampling.LANCZOS)
              art.save(f'{path}/ic_launcher.png',optimize=True)
              art.save(f'{path}/ic_launcher_round.png',optimize=True)
          p='android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.isdir(p): shutil.rmtree(p)
          PY
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudAI-v2.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudAI-v2.3-APK
          path: EstudAI-v2.3.apk
          if-no-files-found: error
          retention-days: 30