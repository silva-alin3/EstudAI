name: Fetch APK Signer
on:
  push:
    branches: [v1-9-improvements]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download signer
        run: curl -L --fail --retry 3 -o uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Verify checksum
        run: echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar" | sha256sum -c -
      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer
          path: uber-apk-signer-1.3.0.jar
          retention-days: 1
