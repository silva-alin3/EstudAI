<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B7A3B" />
  <title>EstudAI — ENEM com inteligência</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--p:#0B7A3B;--p2:#18A558;--ink:#123126;--muted:#65756C;--bg:#F7FBF8;--card:#fff;--line:#D9E9DE;--green:#16A34A;--red:#df3c3c;--yellow:#FFCB2F;--shadow:0 12px 30px rgba(11,122,59,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#F1FAF4 0,#FFFDF3 55%,#fff);color:var(--ink)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{min-height:100vh}.brasil-stripe{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#0B7A3B 0 42%,#FFCB2F 42% 68%,#005CA9 68% 100%)}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px}.brand-badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#0B7A3B 0 58%,#005CA9 58% 100%);border:2px solid #FFCB2F;box-shadow:0 8px 18px rgba(11,122,59,.24)}
    .top-stats{display:flex;gap:10px}.stat{background:#F8FCF9;border:1px solid var(--line);border-radius:14px;padding:7px 10px;font-size:13px;font-weight:800;white-space:nowrap}
    .shell{display:grid;grid-template-columns:230px 1fr 300px;gap:22px;max-width:1400px;margin:auto;padding:22px}
    .side,.right{position:sticky;top:76px;align-self:start}.nav{background:white;border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow)}
    .nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:16px;padding:13px 14px;text-align:left;font-weight:800;color:#4D6257;margin:3px 0}.nav button.active{background:#E8F7ED;color:var(--p)}
    .main{min-width:0}.hero{background:linear-gradient(135deg,#0B7A3B 0%,#138A47 58%,#FFCB2F 145%);color:white;position:relative;overflow:hidden;border-radius:28px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 18px 40px rgba(11,122,59,.22)}
    .hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,203,47,.18);right:-55px;top:-75px}.hero h1{font-size:32px;margin:0 0 8px}.hero p{margin:0;opacity:.9;max-width:650px}.hero-cta{border:0;background:#FFCB2F;color:#123126;font-weight:900;border-radius:16px;padding:13px 18px}
    .section-title{font-size:21px;font-weight:900;margin:24px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
    .kicker{font-size:12px;font-weight:900;color:var(--p);text-transform:uppercase;letter-spacing:.08em}.card h3{margin:8px 0 6px}.muted{color:var(--muted)}.progress{height:10px;background:#E6F1E9;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#0B7A3B,#FFCB2F);border-radius:inherit}
    .path{display:flex;flex-direction:column;gap:14px}.unit{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:16px;background:white;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}
    .orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#0B7A3B,#005CA9);color:#fff;border:5px solid #DFF1E5}.unit.locked .orb{background:#ddd;color:#7B8C83;border-color:#EDF3EF}.pill{padding:7px 10px;border-radius:999px;background:#E8F7ED;color:var(--p);font-size:12px;font-weight:900}
    .right .card{margin-bottom:14px}.rank{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EDF4EF}.rank:last-child{border-bottom:0}.mini-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#E8F7ED}
    .hidden{display:none!important}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.field{background:white;border:1px solid var(--line);border-radius:16px;padding:12px 14px;outline:none}.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:900}.btn.primary{background:linear-gradient(135deg,#0B7A3B,#005CA9);color:white}.btn.soft{background:#E8F7ED;color:var(--p)}.btn.yellow{background:#FFF3B8;color:#6A4B00}.btn.green{background:#E4F8EA;color:#0A6C36}
    .exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.exam{background:white;border:1px solid var(--line);border-radius:20px;padding:16px}.exam .year{font-size:28px;font-weight:950;color:var(--p)}.exam-actions{display:flex;gap:8px;margin-top:12px}.exam-actions button{flex:1}
    .question{background:white;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.qmeta{display:flex;justify-content:space-between;gap:12px;align-items:center}.qtext{font-size:20px;line-height:1.45;font-weight:800;margin:18px 0}.option{width:100%;text-align:left;padding:15px;border:2px solid #DDEBE1;border-radius:16px;background:white;margin:8px 0;font-weight:700}.option:hover{border-color:#74B98F}.option.selected{border-color:var(--p);background:#EDF8F0}.option.correct{border-color:var(--green);background:#E8F9EE}.option.wrong{border-color:var(--red);background:#FFF1F1}.feedback{border-left:5px solid var(--p);background:#F7FAF8;border-radius:18px;padding:16px;margin-top:16px;line-height:1.55}
    .essay-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.topic{background:linear-gradient(135deg,#fff,#FFF8D8);border:1px solid var(--line);border-radius:22px;padding:20px}.textarea{width:100%;min-height:420px;border:1px solid var(--line);border-radius:18px;padding:16px;resize:vertical;outline:none;background:white}.rubric{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.score{background:white;border:1px solid var(--line);border-radius:15px;padding:11px;text-align:center}.score strong{display:block;font-size:22px;color:var(--p)}
    .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.summary-card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#E7F5EC;color:var(--p);font-size:12px;font-weight:900;margin:3px}
    .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#EDF8F0;border:1px solid #D3E8DA;border-radius:18px;padding:15px}.metric small{display:block;color:#5E7166;font-weight:800}.metric strong{font-size:24px;color:var(--p)}
    .toast{position:fixed;right:20px;bottom:20px;background:#0D3B25;color:white;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:99}.mobile-nav{display:none}
    @media(max-width:1050px){.shell{grid-template-columns:190px 1fr}.right{display:none}.grid,.exam-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.top-stats{display:none}.shell{display:block;padding:14px 14px 86px}.side{display:none}.hero{padding:20px;align-items:flex-start}.hero h1{font-size:27px}.grid,.exam-grid,.summary-grid,.essay-layout,.metric-grid{grid-template-columns:1fr}.unit{grid-template-columns:60px 1fr}.unit .pill{display:none}.orb{width:54px;height:54px}.mobile-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:30}.mobile-nav button{border:0;background:white;padding:10px 2px;font-size:11px;color:#706a7e}.mobile-nav button.active{color:var(--p);font-weight:900}.rubric{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brasil-stripe" aria-hidden="true"></div><div class="brand"><span class="brand-badge">AI</span> EstudAI</div><div class="top-stats"><span class="stat">🔥 12 dias</span><span class="stat">💎 840 XP</span><span class="stat">❤️ 5</span></div></header>
  <div class="shell"><aside class="side"><nav class="nav" id="desktopNav"></nav></aside><main class="main"><section id="home" class="view"></section><section id="trilha" class="view hidden"></section><section id="simulados" class="view hidden"></section><section id="redacao" class="view hidden"></section><section id="resumos" class="view hidden"></section><section id="perfil" class="view hidden"></section></main><aside class="right" id="rightRail"></aside></div><nav class="mobile-nav" id="mobileNav"></nav>
</div>
<script>
const navItems=[['home','🏠','Início'],['trilha','🗺️','Trilha'],['simulados','📝','Simulados'],['redacao','✍️','Redação'],['resumos','📚','Resumos'],['perfil','👤','Perfil']];
const topics=['Desafios para combater a desinformação digital no Brasil','Caminhos para reduzir a evasão escolar entre jovens brasileiros','Impactos da inteligência artificial no mercado de trabalho brasileiro','Desafios para garantir saúde mental aos jovens na era digital','Medidas para enfrentar os eventos climáticos extremos nas cidades brasileiras','Caminhos para ampliar a inclusão de pessoas com deficiência no Brasil','O combate ao desperdício de alimentos e a insegurança alimentar no Brasil','Desafios da valorização da ciência e da pesquisa no Brasil'];
const questions=[{area:'Ciências Humanas',topic:'Guerra Fria',text:'Sobre a Guerra Fria (1947–1991), qual alternativa está correta?',opts:['O Pacto de Varsóvia reuniu países do bloco capitalista.','A Doutrina Truman buscava conter a expansão do comunismo.','A OTAN foi criada pela União Soviética.','A Crise dos Mísseis ocorreu durante a Primeira Guerra Mundial.','O Muro de Berlim foi construído no século XIX.'],ans:1,exp:'A Doutrina Truman, formulada pelos Estados Unidos em 1947, buscava conter a expansão do comunismo.'},{area:'Matemática',topic:'Porcentagem',text:'Um produto de R$ 200 recebe desconto de 15%. Qual é o novo preço?',opts:['R$ 150','R$ 160','R$ 170','R$ 180','R$ 185'],ans:2,exp:'15% de 200 é 30. Portanto, 200 - 30 = R$ 170.'},{area:'Ciências da Natureza',topic:'Ecologia',text:'Em uma cadeia alimentar, os organismos que produzem matéria orgânica a partir de substâncias inorgânicas são chamados de:',opts:['Consumidores','Decompositores','Predadores','Produtores','Parasitas'],ans:3,exp:'Produtores, como plantas e algas, produzem matéria orgânica por processos como a fotossíntese.'},{area:'Linguagens',topic:'Interpretação',text:'Em textos argumentativos, a tese corresponde principalmente:',opts:['Ao título do texto','À posição central defendida pelo autor','À lista de referências','Ao exemplo mais longo','À conclusão obrigatoriamente'],ans:1,exp:'A tese é a ideia ou posicionamento central que o autor busca defender ao longo da argumentação.'}];
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function buildNav(){let html=navItems.map((n,i)=>`<button class="${i===0?'active':''}" onclick="showView('${n[0]}',this)"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('');$('#desktopNav').innerHTML=html;$('#mobileNav').innerHTML=html}
function showView(id,btn){$$('.view').forEach(v=>v.classList.add('hidden'));$('#'+id).classList.remove('hidden');$$('.nav button,.mobile-nav button').forEach(b=>b.classList.remove('active'));let idx=navItems.findIndex(n=>n[0]===id);if($('#desktopNav').children[idx])$('#desktopNav').children[idx].classList.add('active');if($('#mobileNav').children[idx])$('#mobileNav').children[idx].classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function renderHome(){$('#home').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Seu plano de hoje</div><h1>Bora estudar para o ENEM? 🇧🇷</h1><p>Complete sua meta diária, ganhe XP e avance na trilha.</p></div><button class="hero-cta" onclick="showView('trilha')">Continuar trilha</button></div><div class="section-title">Missões de hoje</div><div class="grid"><div class="card"><div class="kicker">10 min</div><h3>📚 Revisão rápida</h3><p class="muted">Revise um resumo e responda 3 questões.</p><div class="progress"><i style="width:60%"></i></div></div><div class="card"><div class="kicker">+40 XP</div><h3>📝 Mini simulado</h3><p class="muted">Treine questões no estilo ENEM.</p><button class="btn soft" onclick="startQuiz()">Começar</button></div><div class="card"><div class="kicker">Redação</div><h3>✍️ Tema do dia</h3><p class="muted">Treine argumentação com um tema atual.</p><button class="btn yellow" onclick="showView('redacao')">Treinar</button></div></div><div class="section-title">Seu caminho</div><div class="path"><div class="unit"><div class="orb">📖</div><div><b>Linguagens</b><div class="muted">Interpretação, literatura e gramática</div></div><span class="pill">72%</span></div><div class="unit"><div class="orb">🌎</div><div><b>Ciências Humanas</b><div class="muted">História, geografia, sociologia e filosofia</div></div><span class="pill">68%</span></div><div class="unit"><div class="orb">🧬</div><div><b>Ciências da Natureza</b><div class="muted">Biologia, química e física</div></div><span class="pill">54%</span></div><div class="unit"><div class="orb">➗</div><div><b>Matemática</b><div class="muted">Razão, funções, geometria e estatística</div></div><span class="pill">61%</span></div><div class="unit"><div class="orb">✍️</div><div><b>Redação</b><div class="muted">Competências, repertório e prática</div></div><span class="pill">76%</span></div></div>`}
function renderTrilha(){$('#trilha').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Trilha EstudAI</div><h1>Aprenda em pequenas etapas</h1><p>Avance por unidades, ganhe XP e revise seus pontos fracos.</p></div><button class="hero-cta" onclick="toast('Meta diária atualizada')">Meta diária</button></div><div class="section-title">Unidades</div><div class="path">${[['📖','Linguagens','Interpretação de texto','Concluído'],['🌎','Humanas','Brasil República','Em andamento'],['🧬','Natureza','Ecologia e ambiente','Próximo'],['➗','Matemática','Porcentagem e razão','Bloqueado'],['✍️','Redação','Introdução nota 1000','Bloqueado']].map((u,i)=>`<div class="unit ${i>2?'locked':''}"><div class="orb">${u[0]}</div><div><b>${u[1]}</b><div class="muted">${u[2]}</div></div><span class="pill">${u[3]}</span></div>`).join('')}</div>`}
function renderSimulados(){let years=Array.from({length:17},(_,i)=>2025-i);$('#simulados').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Simulados</div><h1>Treine como se fosse o ENEM</h1><p>Faça simulados, acompanhe seu tempo e revise cada erro.</p></div><button class="hero-cta" onclick="startQuiz()">Gerar simulado</button></div><div class="section-title">Provas anteriores</div><div class="exam-grid">${years.map(y=>`<div class="exam"><div class="year">${y}</div><div class="muted">ENEM • prova e gabarito</div><div class="exam-actions"><button class="btn soft" onclick="toast('Prova ${y}: interface demonstrativa')">Abrir</button><button class="btn yellow" onclick="toast('Gabarito ${y}: interface demonstrativa')">Gabarito</button></div></div>`).join('')}</div>`}
let currentQuestion=0,correct=0,selected=null,startTime=0,timerInt=null;
function startQuiz(){showView('simulados');currentQuestion=0;correct=0;selected=null;startTime=Date.now();renderQuestion()}
function renderQuestion(){clearInterval(timerInt);let q=questions[currentQuestion%questions.length];$('#simulados').innerHTML=`<div class="question"><div class="qmeta"><span class="pill">${q.area}</span><b>Questão ${currentQuestion+1} de ${questions.length}</b><span id="timer">00:00</span></div><div class="qtext"><span style="color:var(--p)">(${q.topic})</span> ${q.text}</div><div id="options">${q.opts.map((o,i)=>`<button class="option" onclick="selectOption(${i},this)"><b>${String.fromCharCode(65+i)})</b> ${o}</button>`).join('')}</div><div class="toolbar" style="margin-top:14px"><button class="btn yellow" onclick="eliminate()">🪄 Eliminar 2</button><button id="confirmBtn" class="btn primary" onclick="confirmAnswer()" disabled>Confirmar resposta</button></div><div id="feedback"></div></div>`;timerInt=setInterval(()=>{let s=Math.floor((Date.now()-startTime)/1000);let el=$('#timer');if(el)el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000)}
function selectOption(i,el){selected=i;$$('.option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');$('#confirmBtn').disabled=false}
function eliminate(){let q=questions[currentQuestion%questions.length],count=0;$$('.option').forEach((o,i)=>{if(i!==q.ans&&count<2){o.disabled=true;o.style.opacity=.45;o.style.textDecoration='line-through';count++}});toast('2 alternativas eliminadas')}
function confirmAnswer(){let q=questions[currentQuestion%questions.length];$$('.option').forEach((o,i)=>{o.disabled=true;if(i===q.ans)o.classList.add('correct');if(i===selected&&i!==q.ans)o.classList.add('wrong')});if(selected===q.ans)correct++;$('#feedback').innerHTML=`<div class="feedback"><h3 style="margin:0 0 8px;color:${selected===q.ans?'var(--green)':'var(--red)'}">${selected===q.ans?'Resposta correta! ✅':'Resposta incorreta'}</h3><div>${q.exp}</div><button class="btn primary" style="margin-top:12px" onclick="nextQuestion()">${currentQuestion===questions.length-1?'Ver resultado':'Próxima questão'}</button></div>`;$('#confirmBtn').disabled=true;clearInterval(timerInt)}
function nextQuestion(){currentQuestion++;selected=null;if(currentQuestion>=questions.length)renderResult();else renderQuestion()}
function renderResult(){let total=Math.floor((Date.now()-startTime)/1000),pct=Math.round(correct/questions.length*100);$('#simulados').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Simulado concluído</div><h1>${correct}/${questions.length} acertos</h1><p>Seu aproveitamento foi de ${pct}%. Continue praticando para subir seu desempenho.</p></div><button class="hero-cta" onclick="startQuiz()">Novo simulado</button></div><div class="section-title">Seu desempenho</div><div class="metric-grid"><div class="metric"><small>Aproveitamento</small><strong>${pct}%</strong></div><div class="metric"><small>Tempo total</small><strong>${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}</strong></div><div class="metric"><small>Acertos</small><strong>${correct}</strong></div><div class="metric"><small>Erros</small><strong>${questions.length-correct}</strong></div></div>`}
function renderRedacao(){let t=topics[Math.floor(Math.random()*topics.length)];$('#redacao').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Redação ENEM</div><h1>Treine as 5 competências</h1><p>Escolha ou sorteie temas, escreva no editor e receba uma análise estruturada.</p></div><button class="hero-cta" onclick="randomTopic()">🎲 Sortear tema</button></div><div class="section-title">Tema de hoje</div><div class="essay-layout"><div><div class="topic"><div class="kicker">Proposta de redação</div><h2 id="essayTopic">${t}</h2><p class="muted">Escreva um texto dissertativo-argumentativo em norma-padrão, apresentando proposta de intervenção que respeite os direitos humanos.</p><div class="toolbar"><button class="btn soft" onclick="randomTopic()">🎲 Sortear</button><button class="btn soft" onclick="showTopicList()">📚 Escolher tema</button></div></div><div class="section-title">Sua redação</div><textarea id="essayText" class="textarea" placeholder="Comece sua redação aqui..."></textarea><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px"><span class="muted" id="wordCount">0 palavras</span><button class="btn primary" onclick="analyzeEssay()">✨ Corrigir minha redação</button></div></div><div><div class="card"><h3>🎓 Aulas de redação</h3><p class="muted">Estrutura, tese, repertório, coesão e proposta de intervenção.</p><div class="progress"><i style="width:40%"></i></div><p><b>2 de 5 aulas concluídas</b></p></div><div class="card"><h3>💡 Dicas rápidas</h3><p>• Defina uma tese clara na introdução.<br>• Use repertório pertinente, não decorativo.<br>• Conecte parágrafos com operadores argumentativos.<br>• Feche com agente, ação, meio e finalidade.</p></div><div class="card" id="essayAnalysis"><h3>📊 Correção</h3><p class="muted">Sua análise aparecerá aqui após o envio.</p></div></div></div>`;setTimeout(()=>{$('#essayText').oninput=()=>$('#wordCount').textContent=$('#essayText').value.trim()?$('#essayText').value.trim().split(/\s+/).length+' palavras':'0 palavras'},0)}
function randomTopic(){let t=topics[Math.floor(Math.random()*topics.length)];let el=$('#essayTopic');if(el)el.textContent=t;else{showView('redacao');setTimeout(()=>$('#essayTopic').textContent=t,0)}}
function showTopicList(){let chosen=prompt('Escolha um número de 1 a '+topics.length+'\n\n'+topics.map((t,i)=>`${i+1}. ${t}`).join('\n'));let n=Number(chosen);if(n>=1&&n<=topics.length)$('#essayTopic').textContent=topics[n-1]}
function analyzeEssay(){let txt=$('#essayText').value.trim();if(txt.split(/\s+/).length<30){toast('Escreva um pouco mais para receber análise.');return}let base=Math.min(200,120+Math.floor(txt.split(/\s+/).length/12)*10);let scores=[base,Math.min(200,base+20),Math.max(120,base-20),base,Math.min(200,base+10)],total=scores.reduce((a,b)=>a+b,0);$('#essayAnalysis').innerHTML=`<h3>📊 Nota estimada: <span style="color:var(--p)">${total}/1000</span></h3><div class="rubric">${scores.map((s,i)=>`<div class="score"><small>C${i+1}</small><strong>${s}</strong></div>`).join('')}</div><p class="muted">Análise demonstrativa: boa organização geral. Reforce a especificidade do repertório, varie conectivos e detalhe mais a proposta de intervenção.</p>`;toast('Correção concluída')}
function renderResumos(){let items=[['Linguagens','Interpretação de texto','Estratégias de leitura, inferência, gêneros textuais e funções da linguagem.'],['Humanas','Brasil República','República Velha, Era Vargas, Ditadura Militar e Nova República.'],['Humanas','Geopolítica','Globalização, blocos econômicos, conflitos e organismos internacionais.'],['Matemática','Porcentagem e razão','Proporção, regra de três, juros e aplicações práticas.'],['Matemática','Funções','Função afim, quadrática, exponencial e leitura de gráficos.'],['Natureza','Ecologia','Cadeias alimentares, ciclos biogeoquímicos, impactos ambientais e sustentabilidade.'],['Natureza','Genética','DNA, hereditariedade, Mendel, biotecnologia e evolução.'],['Redação','Competências ENEM','Como atingir 200 pontos em cada uma das cinco competências.']];$('#resumos').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Biblioteca</div><h1>Resumos para revisar rápido</h1><p>Conteúdo organizado por área, com leitura curta e foco no que mais cai.</p></div><button class="hero-cta" onclick="toast('Modo revisão ativado')">Modo revisão</button></div><div class="section-title">Todos os resumos</div><div class="summary-grid">${items.map(x=>`<div class="summary-card"><span class="tag">${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p><button class="btn soft" onclick="openSummary('${x[1]}')">Ler resumo</button></div>`).join('')}</div>`}
function openSummary(title){alert(title+'\n\nResumo demonstrativo:\n• Conceitos essenciais\n• O que mais cai no ENEM\n• Exemplos práticos\n• Erros comuns\n• Mini revisão com 3 questões')}
function renderPerfil(){$('#perfil').innerHTML=`<div class="hero"><div><div class="kicker" style="color:#FFF3B0">Seu progresso</div><h1>Nível 8 • Exploradora</h1><p>Você está construindo uma rotina consistente. Continue para manter sua sequência.</p></div><button class="hero-cta">Editar perfil</button></div><div class="section-title">Visão geral</div><div class="metric-grid"><div class="metric"><small>XP total</small><strong>840</strong></div><div class="metric"><small>Sequência</small><strong>12 dias</strong></div><div class="metric"><small>Questões</small><strong>326</strong></div><div class="metric"><small>Redações</small><strong>4</strong></div></div><div class="section-title">Desempenho por área</div><div class="card">${[['Linguagens',72],['Humanas',68],['Natureza',54],['Matemática',61],['Redação',76]].map(x=>`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between"><b>${x[0]}</b><span>${x[1]}%</span></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div>`}
function renderRight(){let people=[['🥇','Lia',1240],['🥈','Rafa',1180],['🥉','Você',840],['4','Duda',790],['5','Caio',750]];$('#rightRail').innerHTML=`<div class="card"><div class="kicker">Liga semanal</div><h3>🏆 Liga Brasil</h3>${people.map(p=>`<div class="rank"><span><span class="mini-avatar">${p[0]}</span> <b>${p[1]}</b></span><span>${p[2]} XP</span></div>`).join('')}</div><div class="card"><div class="kicker">Sequência</div><h3>🔥 12 dias</h3><p class="muted">Estude hoje para manter sua chama acesa.</p><button class="btn yellow" onclick="startQuiz()">Ganhar XP</button></div>`}
buildNav();renderHome();renderTrilha();renderSimulados();renderRedacao();renderResumos();renderPerfil();renderRight();
</script>
